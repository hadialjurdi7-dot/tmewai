# Tmewai web — nginx serving the Flutter build.
#
# The app is a client-side single page: every path falls back to index.html, and
# the two drift assets (sqlite3.wasm, drift_worker.js) are served with the MIME
# types the browser needs to instantiate them.

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json
             application/wasm application/octet-stream image/svg+xml;

  # The wasm module must be fetched as a component, not sniffed as a download.
  location = /sqlite3.wasm {
    types { }
    default_type application/wasm;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # The drift worker runs in a dedicated worker scope.
  location = /drift_worker.js {
    default_type application/javascript;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location ~* \.(js|json|png|jpg|jpeg|svg|woff2?|ttf|otf)$ {
    add_header Cache-Control "public, max-age=3600";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
