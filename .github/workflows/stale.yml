name: Stale

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/stale@v9
        with:
          days-before-stale: 60
          days-before-close: 21
          stale-issue-label: 'stale'
          stale-pr-label: 'stale'
          exempt-issue-labels: 'p1,security,blocker'
          exempt-pr-labels: 'p1,security,blocker,pinned'
          exempt-all-milestones: true
          stale-issue-message: 'لا نشاط منذ 60 يوم — سيُغلق بعد 21 يوم إن بقي بلا تحديث.'
          stale-pr-message: 'لا نشاط منذ 60 يوم — سيُغلق بعد 21 يوم إن بقي بلا تحديث.'
