name: Flutter CI and Windows build

on:
  push:
    paths:
      - '.github/workflows/windows-build.yml'
      - 'analysis_options.yaml'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'lib/**'
      - 'assets/**'
      - 'test/**'
  pull_request:
    paths:
      - '.github/workflows/windows-build.yml'
      - 'analysis_options.yaml'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'lib/**'
      - 'assets/**'
      - 'test/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Analyze, test, and build Windows x64
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          # Pinned: a newer stable deprecates APIs this app still uses
          # (e.g. package:flutter/material.dart on 3.50) and --fatal-infos
          # then fails the build. The release workflow already pins the same.
          flutter-version: '3.47.9'
          channel: stable
          cache: true

      - name: Generate Windows desktop runner
        run: flutter create --platforms=windows --project-name personal_data_agent .

      - name: Name the executable and window after the product
        shell: bash
        # flutter create names the binary after the current Dart package
        # (personal_data_agent) in both CMakeLists; the shipped app is tmewai.exe.
        run: |
          grep -rl 'personal_data_agent' windows/ | xargs -r sed -i 's/personal_data_agent/tmewai/g'
          sed -i 's/L"tmewai"/L"Tmewai"/g' windows/runner/main.cpp
          grep -rn 'BINARY_NAME\|L"Tmewai"' windows/CMakeLists.txt windows/runner/CMakeLists.txt windows/runner/main.cpp

      - name: Use the Tmewai app icon for the Windows runner
        shell: bash
        # flutter create writes a placeholder icon; the committed mark replaces
        # it so the executable and taskbar show the real product.
        run: cp assets/branding/tmewai.ico windows/runner/resources/app_icon.ico

      - name: Drop the generated placeholder widget test
        shell: bash
        run: rm -f test/widget_test.dart

      - name: Install Dart dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build Windows release
        run: flutter build windows --release

      - name: Assert the executable is named tmewai.exe
        shell: bash
        run: |
          ls -l build/windows/x64/runner/Release/*.exe
          test -f build/windows/x64/runner/Release/tmewai.exe
